services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: beauty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: beautypg
      POSTGRES_USER: beauty
      POSTGRES_PASSWORD: beauty
    ports:
      - "5433:5432"
    volumes:
      - beauty-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beauty -d beautypg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beauty-postgres-data:
