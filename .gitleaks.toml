# Used by the Secret Scan stage in the Jenkinsfile.
[extend]
useDefault = true

[allowlist]
description = "Not part of the source tree, or not a real secret"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)target/''',
  '''(^|/)gitleaks-report\.json$''',
  # Throwaway key pair used only by the test profile.
  '''(^|/)src/test/resources/jwt/''',
]
