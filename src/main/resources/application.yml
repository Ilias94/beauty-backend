# Only health is served (the Kubernetes probes and the Jenkins smoke test read
# /actuator/health/readiness). Every other endpoint (env, heapdump, configprops...) would hand
# out secrets: the app's security config lets every request through to method-level checks.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
server:
  port: 8082
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/beautypg}
    username: ${DB_USERNAME:beauty}
    password: ${DB_PASSWORD:beauty}
    hikari:
      connection-init-sql: "SET search_path TO beautypg, public"
  jackson:
    serialization:
      fail-on-empty-beans: false
    # Jackson 3 (Spring Boot 4) rejects a missing value for an int/double/boolean field, which broke
    # requests that leave such fields out; keep Boot 3's behaviour of reading them as 0/false.
    deserialization:
      fail-on-null-for-primitives: false
  # Course photos arrive resized in the browser; the limits leave room for a gallery sent in one go.
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 50MB
  flyway:

    enabled: true
    locations: classpath:db/migration/postgresql
    schemas: beautypg
    placeholder-replacement: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          ssl:
            trust: smtp.gmail.com
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_SECRET}

  ai:
    model:
      # EmbeddingModelConfig defines the embedding model; without this the transformers
      # starter also downloads and loads its default all-MiniLM-L6-v2 at startup.
      embedding: none
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-6

  jpa:
    hibernate:
      ddl-auto: none
      default_schema: beautypg
    properties:
      hibernate.default_schema: beautypg

jwt:
  privateKey: ${JWT_PRIVATE_KEY}
  publicKey: ${JWT_PUBLIC_KEY}

aws:
  accessKey: ${AWS_ACCESS_KEY}
  secretKey: ${AWS_SECRET_KEY}

google:
  accessKey: ${GOOGLE_ACCESS_KEY}
  # After startup, looks up map coordinates for addresses saved without them.
  backfill-coordinates: ${GOOGLE_BACKFILL_COORDINATES:true}

stripe:
  secretKey: ${STRIPE_SECRET_KEY}
  # Locally: printed by `stripe listen --forward-to localhost:8082/api/v1/payment/webhook`.
  # Empty: every webhook call fails the signature check, so no payment can be marked paid.
  webhookSecret: ${STRIPE_WEBHOOK_SECRET:}
  returnUrl: ${STRIPE_RETURN_URL:http://localhost:4200/payment-status}
  # Locally: printed by `stripe listen ... --forward-connect-to localhost:8082/api/v1/connect/webhook`
  # (the same whsec_ as above); in production a separate Connect endpoint in the dashboard.
  connectWebhookSecret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}
  payoutsUrl: ${STRIPE_PAYOUTS_URL:http://localhost:4200/payouts}
  # Percent of each sale the platform keeps; set users.platform_fee_percent to change it for one instructor.
  platformFeePercent: ${PLATFORM_FEE_PERCENT:10}

assistant:
  # Turns the /api/v1/assistant chat off without a redeploy of the frontend.
  enabled: ${ASSISTANT_ENABLED:true}
  # Questions per user per day; each one is 1-3 Claude calls depending on the tools used.
  dailyLimit: ${ASSISTANT_DAILY_LIMIT:30}

messaging:
  # New private conversations one user can start per day; replies in existing ones are not counted.
  newConversationsPerDay: ${MESSAGING_NEW_CONVERSATIONS_PER_DAY:10}

embedding:
  # paraphrase-multilingual-MiniLM-L12-v2 pinned to a commit; set EMBEDDING_MODEL_URI=classpath:model.onnx
  # to use a local copy in src/main/resources instead (e.g. offline).
  modelUri: ${EMBEDDING_MODEL_URI:https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2/resolve/e8f8c211226b894fcb81acc59f3b34ba3efd5f42/onnx/model.onnx}

hazelcast:
  network:
    rest-api:
      enabled: true
cors:
  # The frontend's origin, without a trailing slash (e.g. https://bellademy.pl).
  url: ${CORS_URL:http://localhost:4200}

logging:
  level:
    org.flywaydb: DEBUG

